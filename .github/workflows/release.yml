name: GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release validation
        run: node --test tests/release.test.cjs
      - name: Validate version and target
        id: version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release.cjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
